name: Patch Boot Image

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Telegram chat ID to send result to"
        required: true
        type: string
      message_id:
        description: "Telegram message ID containing the uploaded boot.img"
        required: false
        default: ""
        type: string
      status_message_id:
        description: "Telegram message ID of the status message to update"
        required: false
        default: ""
        type: string
      boot_img_url:
        description: "Direct download URL of stock boot.img (optional fallback)"
        required: false
        default: ""
        type: string
      kernel_variant:
        description: "Kernel flavour to inject"
        required: false
        default: "SukiSU"
        type: choice
        options:
          - "SukiSU"
          - "KernelSU-Next"
          - "WKSU"
          - "ReSukiSU"
      kernel_repo:
        description: "GitHub repo hosting kernel artifacts (owner/repo)"
        required: false
        default: "nothingnesscore/BruhKernel"
        type: string
      stock_kernel:
        description: "Reported stock kernel version string"
        required: false
        default: "Unknown"
        type: string
      device_target:
        description: "Optional device target filter (e.g. peridot, or empty for generic GKI)"
        required: false
        default: "peridot"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y wget unzip file curl jq binutils python3-pip

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Dependencies
        run: |
          pip3 install --no-cache-dir telethon pyaes rsa

      - name: Setup magiskboot
        run: |
          chmod +x bin/magiskboot
          cp bin/magiskboot ./magiskboot
          echo "magiskboot ready: $(./magiskboot --version 2>&1 || echo 'ready')"

      # ── Telegram Step: Announce start via status message ───────────────────
      - name: Update Telegram Status - Started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          STATUS_ID: ${{ inputs.status_message_id }}
        run: |
          if [ -n "${STATUS_ID}" ]; then
            python3 bot/tg_progress.py "${CHAT_ID}" "${STATUS_ID}" "⚡ *Building Your Patched Boot Image*
          ━━━━━━━━━━━━━━━━━━━━
          📦 *Flavour:* \`${{ inputs.kernel_variant }}\`
          📱 *Target Device:* \`${{ inputs.device_target || 'peridot' }}\` / GKI 2.0
          🔄 *Progress:* \`[■■□□□□□□□□] 20%\`
          ⏳ *Status:* Cloud runner online. Initializing MTProto pipeline...
          🔗 [Live Runner Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

      # ── Download Stock boot.img ──────────────────────────────────────────
      - name: Download Stock boot.img
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          STATUS_ID: ${{ inputs.status_message_id }}
        run: |
          if [ -n "${{ inputs.message_id }}" ]; then
            echo "Downloading from Telegram MTProto (chat: ${{ inputs.chat_id }}, msg: ${{ inputs.message_id }})..."
            python3 bot/download_tg.py "${CHAT_ID}" "${{ inputs.message_id }}" stock_boot.img "${STATUS_ID}" "${{ inputs.kernel_variant }}" "${{ inputs.device_target || 'peridot' }}"
          elif [ -n "${{ inputs.boot_img_url }}" ]; then
            echo "Downloading from URL: ${{ inputs.boot_img_url }}"
            wget -q "${{ inputs.boot_img_url }}" -O stock_boot.img
          else
            echo "ERROR: Neither message_id nor boot_img_url was provided!"
            exit 1
          fi
          ls -lh stock_boot.img
          file stock_boot.img

      # ── In-Depth Inspection on Runner ────────────────────────────────────
      - name: Inspect Stock boot.img & Update Telegram Specs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          STATUS_ID: ${{ inputs.status_message_id }}
        run: |
          ./magiskboot unpack stock_boot.img

          FORMAT="Android Boot Image"
          OS_VER="14.0"
          PATCH_LVL="Unknown"
          if [ -f header ]; then
            FORMAT=$(grep "^format=" header | cut -d= -f2 | xargs || echo "raw")
            OS_VER_RAW=$(grep "^os_version=" header | cut -d= -f2 | xargs || echo "Unknown")
            PATCH_LVL_RAW=$(grep "^os_patch_level=" header | cut -d= -f2 | xargs || echo "Unknown")
            if [ -n "$OS_VER_RAW" ] && [ "$OS_VER_RAW" != "Unknown" ]; then
              OS_VER="$OS_VER_RAW"
            fi
            if [ -n "$PATCH_LVL_RAW" ] && [ "$PATCH_LVL_RAW" != "Unknown" ]; then
              PATCH_LVL=$(echo "$PATCH_LVL_RAW" | grep -oP '^[0-9]{4}-[0-9]{2}' || echo "$PATCH_LVL_RAW")
            fi
          fi

          STOCK_UNAME="Unknown"
          KERNEL_VER="Unknown"
          ARCH="arm64 (AArch64)"
          COMPRESSION="raw / none"

          if [ -f kernel ]; then
            STOCK_UNAME=$(strings kernel | grep -m1 "Linux version" || echo "Unknown")
            KERNEL_VER=$(echo "$STOCK_UNAME" | grep -oP "Linux version \K[0-9]+\.[0-9]+(\.[0-9]+)?" || echo "6.1.138")
            if strings kernel | grep -q "aarch64"; then
              ARCH="arm64 (AArch64)"
            elif strings kernel | grep -q "ARM"; then
              ARCH="arm32"
            fi
            COMPRESSION=$(file kernel | cut -d: -f2- | xargs)
          fi

          OS_MAJOR=$(echo "$OS_VER" | grep -oP '^[0-9]+' || echo "14")
          VARIANT_LOWER=$(echo "${{ inputs.kernel_variant }}" | tr '[:upper:]' '[:lower:]')
          OUT_BOOT_IMG="${KERNEL_VER}_${VARIANT_LOWER}.img"

          echo "STOCK_UNAME=${STOCK_UNAME}" >> $GITHUB_ENV
          echo "KERNEL_VER=${KERNEL_VER}" >> $GITHUB_ENV
          echo "OS_VER=${OS_VER}" >> $GITHUB_ENV
          echo "OS_MAJOR=${OS_MAJOR}" >> $GITHUB_ENV
          echo "PATCH_LVL=${PATCH_LVL}" >> $GITHUB_ENV
          echo "ARCH=${ARCH}" >> $GITHUB_ENV
          echo "FORMAT=${FORMAT}" >> $GITHUB_ENV
          echo "COMPRESSION=${COMPRESSION}" >> $GITHUB_ENV
          echo "VARIANT_LOWER=${VARIANT_LOWER}" >> $GITHUB_ENV
          echo "OUT_BOOT_IMG=${OUT_BOOT_IMG}" >> $GITHUB_ENV

          # Clean up temporary unpack before clean patching
          rm -f kernel ramdisk* dtb* extra second recovery_dtbo
          ./magiskboot cleanup 2>/dev/null || true

          if [ -n "${STATUS_ID}" ]; then
            python3 bot/tg_progress.py "${CHAT_ID}" "${STATUS_ID}" "⚡ *Building Your Patched Boot Image*
          ━━━━━━━━━━━━━━━━━━━━
          📱 *Device Profile:* \`Poco F6 (peridot) / GKI 2.0\`
          🐧 *Kernel Version:* \`Linux ${KERNEL_VER}\`
          🤖 *Android Version:* \`Android ${OS_VER}\`
          🛡️ *Patch Level:* \`${PATCH_LVL}\`
          🏗️ *Architecture:* \`${ARCH}\`
          🗜️ *Boot Format:* \`Boot ${FORMAT}\`
          ━━━━━━━━━━━━━━━━━━━━
          📦 *Target Flavour:* \`${{ inputs.kernel_variant }}\`
          🏷️ *Target Output:* \`${OUT_BOOT_IMG}\`
          🔄 *Progress:* \`[■■■■■□□□□□] 50%\`
          ⏳ *Status:* Stock boot inspected! Matching BruhKernel builds...
          🔗 [Live Runner Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

      # ── Fetch Matching Kernel Artifact ───────────────────────────────────
      - name: Download Kernel Artifact
        env:
          GH_TOKEN: ${{ secrets.BRUHKERNEL_GH_TOKEN || secrets.BOT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          VARIANT: ${{ inputs.kernel_variant }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          STATUS_ID: ${{ inputs.status_message_id }}
        run: |
          echo "================================================="
          echo "Auto-Detected Specs from Stock Boot Image:"
          echo "  • Kernel Version:       ${KERNEL_VER}"
          echo "  • Android Version:      ${OS_VER} (Major: ${OS_MAJOR})"
          echo "  • Security Patch Level: ${PATCH_LVL}"
          echo "  • Architecture:         ${ARCH}"
          echo "  • Target Flavour:       ${VARIANT}"
          echo "  • Output Boot Image:    ${OUT_BOOT_IMG}"
          echo "================================================="

          echo "Searching artifacts in ${KERNEL_REPO} for strictly matching build..."

          ARTIFACT_JSON=$(curl -s \
            "https://api.github.com/repos/${KERNEL_REPO}/actions/artifacts?per_page=100" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json")

          # Strict filter: Must match Variant + AnyKernel3 + Kernel Version + SPL + Android Major
          ARTIFACT=$(echo "$ARTIFACT_JSON" | jq -r \
            --arg v "$VARIANT" \
            --arg kv "$KERNEL_VER" \
            --arg spl "$PATCH_LVL" \
            --arg a "$OS_MAJOR" \
            '[.artifacts[] | select(
              (.expired == false) and
              (.name | test("AnyKernel3"; "i")) and
              (.name | test($v; "i")) and
              (.name | test("(^|[^0-9.])" + $kv + "([^0-9.]|$)")) and
              (if $spl != "Unknown" and $spl != "" then (.name | contains($spl)) else true end) and
              (if $a != "Unknown" and $a != "" then (.name | test("android" + $a + "|a" + $a; "i")) else true end)
            )] | sort_by(.created_at) | last // empty')

          ARTIFACT_NAME=$(echo "$ARTIFACT" | jq -r '.name // empty')
          ARTIFACT_URL=$(echo "$ARTIFACT" | jq -r '.archive_download_url // empty')

          if [ -z "$ARTIFACT_NAME" ]; then
            echo "No matching artifact in GitHub Actions cache for ${KERNEL_VER} (SPL: ${PATCH_LVL})."
            echo "Checking GitHub Releases for exact match..."
            RELEASE_JSON=$(curl -s "https://api.github.com/repos/${KERNEL_REPO}/releases" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json")

            ASSET_URL=$(echo "$RELEASE_JSON" | jq -r \
              --arg v "$VARIANT" \
              --arg kv "$KERNEL_VER" \
              --arg spl "$PATCH_LVL" \
              '[.[].assets[] | select(
                (.name | test($v; "i")) and
                (.name | test("(^|[^0-9.])" + $kv + "([^0-9.]|$)")) and
                (if $spl != "Unknown" and $spl != "" then (.name | contains($spl)) else true end)
              )] | first | .browser_download_url // empty')

            if [ -n "$ASSET_URL" ]; then
              echo "Downloading strictly matched release asset: $ASSET_URL"
              wget -q "$ASSET_URL" -O kernel_release.zip
              mkdir -p ak3
              unzip -q kernel_release.zip -d ak3/
              ARTIFACT_NAME="Release: $(basename "$ASSET_URL")"
            else
              echo "No cached artifact or release matching Linux ${KERNEL_VER} + SPL ${PATCH_LVL} found in ${KERNEL_REPO}."
              TARGET_STR="android${OS_MAJOR}-${KERNEL_VER} (${PATCH_LVL})"
              echo "Checking if BruhKernel Build for target '${TARGET_STR}' is running or can be dispatched..."

              ACTIVE_RUN=$(curl -s "https://api.github.com/repos/${KERNEL_REPO}/actions/workflows/kernel-custom.yml/runs?status=in_progress&per_page=5" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" | jq -r '.workflow_runs[0] // empty')

              if [ -n "$ACTIVE_RUN" ] && [ "$ACTIVE_RUN" != "null" ]; then
                RUN_URL=$(echo "$ACTIVE_RUN" | jq -r '.html_url // empty')
                RUN_ID_BK=$(echo "$ACTIVE_RUN" | jq -r '.id // empty')
                echo "A BruhKernel Build is already compiling: $RUN_URL (ID: $RUN_ID_BK)"
                if [ -n "${STATUS_ID}" ]; then
                  BK_MSG=$(printf '⚡ *BruhKernel Build In Progress*\n━━━━━━━━━━━━━━━━━━━━\n🐧 *Stock Kernel:* `Linux %s`\n🤖 *Android Version:* `Android %s`\n🛡️ *Security Patch Level:* `%s`\n📦 *Flavour:* `%s`\n⏳ *Status:* Kernel is currently compiling in BruhKernel!\n🔗 [Watch BruhKernel Build](%s)' "${KERNEL_VER}" "${OS_VER}" "${PATCH_LVL}" "${VARIANT}" "${RUN_URL}")
                  python3 bot/tg_progress.py "${CHAT_ID}" "${STATUS_ID}" "$BK_MSG"
                fi
              else
                echo "Enquiring / triggering on-demand BruhKernel Build for ${TARGET_STR} (${VARIANT})..."
                DISPATCH_CODE=$(curl -s -w "%{http_code}" -o /dev/null -X POST \
                  "https://api.github.com/repos/${KERNEL_REPO}/actions/workflows/kernel-custom.yml/dispatches" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -d "{\"ref\":\"main\",\"inputs\":{\"quick_target\":\"${TARGET_STR}\",\"ksu_variant\":\"${VARIANT}\"}}")

                echo "BruhKernel dispatch HTTP status: $DISPATCH_CODE"
                if [ "$DISPATCH_CODE" = "204" ]; then
                  echo "Successfully dispatched BruhKernel Build for ${TARGET_STR}!"
                  if [ -n "${STATUS_ID}" ]; then
                    BK_DISP_MSG=$(printf '🚀 *Dispatched BruhKernel Build*\n━━━━━━━━━━━━━━━━━━━━\n🐧 *Stock Kernel:* `Linux %s`\n🤖 *Android Version:* `Android %s`\n🛡️ *Security Patch Level:* `%s`\n📦 *Flavour:* `%s`\n🎯 *Target:* `%s`\n━━━━━━━━━━━━━━━━━━━━\n⚠️ *Notice:* BootPatcher will never patch a mismatched kernel version or different patch level to prevent device bootloops.\n⏳ *Status:* On-demand build triggered in BruhKernel! Once completed, send your `boot.img` again to receive your patched image.\n🔗 [BruhKernel Actions](https://github.com/%s/actions)' "${KERNEL_VER}" "${OS_VER}" "${PATCH_LVL}" "${VARIANT}" "${TARGET_STR}" "${KERNEL_REPO}")
                    python3 bot/tg_progress.py "${CHAT_ID}" "${STATUS_ID}" "$BK_DISP_MSG"
                  fi
                else
                  ERR_MSG=$(printf '❌ *Compatibility Mismatch: No Kernel Found*\n━━━━━━━━━━━━━━━━━━━━\n🐧 *Stock Kernel:* `Linux %s`\n🤖 *Android Version:* `Android %s`\n🛡️ *Security Patch Level:* `%s`\n📦 *Requested Flavour:* `%s`\n━━━━━━━━━━━━━━━━━━━━\n⚠️ No matching kernel artifact was found in `%s`, and on-demand dispatch returned HTTP %s.' "${KERNEL_VER}" "${OS_VER}" "${PATCH_LVL}" "${VARIANT}" "${KERNEL_REPO}" "${DISPATCH_CODE}")
                  if [ -n "${STATUS_ID}" ]; then
                    python3 bot/tg_progress.py "${CHAT_ID}" "${STATUS_ID}" "${ERR_MSG}"
                  fi
                fi
              fi
              exit 1
            fi
          else
            echo "Found strictly matching artifact: ${ARTIFACT_NAME}"
            curl -L -o kernel_artifact.zip \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${ARTIFACT_URL}"

            unzip -q kernel_artifact.zip -d artifact_extracted/
            AK3_ZIP=$(find artifact_extracted/ -name "*.zip" | head -1)
            mkdir -p ak3
            if [ -n "$AK3_ZIP" ]; then
              unzip -q "$AK3_ZIP" -d ak3/
            else
              cp -r artifact_extracted/* ak3/
            fi
          fi

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

          KERNEL_BIN=$(find ak3/ \( -name "Image" -o -name "Image.gz" -o -name "Image.lz4" -o -name "Image.gz-dtb" \) | head -1)
          if [ -z "$KERNEL_BIN" ]; then
            echo "ERROR: Kernel Image binary missing in artifact package!"
            ls -laR ak3/
            exit 1
          fi

          echo "Kernel image located at: $KERNEL_BIN"
          cp "$KERNEL_BIN" new_kernel
          ls -lh new_kernel

          NEW_UNAME=$(strings new_kernel | grep -m1 "Linux version" || echo "Custom GKI")
          NEW_UNAME_SHORT=$(echo "$NEW_UNAME" | grep -oP "Linux version \K[0-9]+\.[0-9]+(\.[0-9]+)?" || echo "${KERNEL_VER}")
          echo "NEW_UNAME=${NEW_UNAME}" >> $GITHUB_ENV
          echo "NEW_UNAME_SHORT=${NEW_UNAME_SHORT}" >> $GITHUB_ENV

          # Guard check: Ensure kernel version matches
          if [ "$NEW_UNAME_SHORT" != "$KERNEL_VER" ]; then
            echo "CRITICAL WARNING: Fetched kernel ($NEW_UNAME_SHORT) does not match stock kernel ($KERNEL_VER)!"
            MISMATCH_MSG=$(printf '❌ *Version Mismatch Detected!*\n━━━━━━━━━━━━━━━━━━━━\n🐧 *Stock Kernel:* `Linux %s`\n⚠️ *Fetched Kernel:* `Linux %s`\n🚫 Patching halted to protect your device from bootloops.' "${KERNEL_VER}" "${NEW_UNAME_SHORT}")
            if [ -n "${STATUS_ID}" ]; then
              python3 bot/tg_progress.py "${CHAT_ID}" "${STATUS_ID}" "${MISMATCH_MSG}"
            fi
            exit 1
          fi

          if [ -n "${STATUS_ID}" ]; then
            python3 bot/tg_progress.py "${CHAT_ID}" "${STATUS_ID}" "⚡ *Building Your Patched Boot Image*
          ━━━━━━━━━━━━━━━━━━━━
          📱 *Device Profile:* \`Poco F6 (peridot) / GKI 2.0\`
          🐧 *Stock Kernel:* \`Linux ${KERNEL_VER}\`
          🆕 *BruhKernel:* \`Linux ${NEW_UNAME_SHORT}\`
          🤖 *Android Version:* \`Android ${OS_VER}\`
          🛡️ *Patch Level:* \`${PATCH_LVL}\`
          ━━━━━━━━━━━━━━━━━━━━
          📦 *Target Flavour:* \`${{ inputs.kernel_variant }}\`
          🏷️ *Target Output:* \`${OUT_BOOT_IMG}\`
          🔄 *Progress:* \`[■■■■■■■□□□] 70%\`
          ⏳ *Status:* Kernel artifact fetched! Repacking as \`${OUT_BOOT_IMG}\`...
          🔗 [Live Runner Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

      # ── Unpack, Swap, and Repack ─────────────────────────────────────────
      - name: Patch boot.img using magiskboot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          STATUS_ID: ${{ inputs.status_message_id }}
        run: |
          mkdir -p patch_env
          cp stock_boot.img patch_env/boot.img
          cp new_kernel patch_env/Image
          cd patch_env

          echo "1. Unpacking stock boot.img..."
          ../magiskboot unpack boot.img

          echo "2. Replacing old kernel..."
          [ -f kernel ] && rm -f kernel
          cp Image kernel

          echo "3. Repacking boot.img into ${{ env.OUT_BOOT_IMG }}..."
          ../magiskboot repack boot.img "${{ env.OUT_BOOT_IMG }}" || true
          if [ ! -f "${{ env.OUT_BOOT_IMG }}" ] && [ -f new-boot.img ]; then
            mv new-boot.img "${{ env.OUT_BOOT_IMG }}"
          fi

          if [ ! -f "${{ env.OUT_BOOT_IMG }}" ]; then
            echo "ERROR: ${{ env.OUT_BOOT_IMG }} was not generated!"
            exit 1
          fi

          ls -lh "${{ env.OUT_BOOT_IMG }}"
          echo "Patching successful: ${{ env.OUT_BOOT_IMG }}"
          cd ..

          if [ -n "${STATUS_ID}" ]; then
            python3 bot/tg_progress.py "${CHAT_ID}" "${STATUS_ID}" "⚡ *Building Your Patched Boot Image*
          ━━━━━━━━━━━━━━━━━━━━
          📱 *Device Profile:* \`Poco F6 (peridot) / GKI 2.0\`
          🐧 *Kernel Version:* \`Linux ${{ env.KERNEL_VER }}\`
          🆕 *BruhKernel:* \`Linux ${{ env.NEW_UNAME_SHORT }}\`
          🤖 *Android Version:* \`Android ${{ env.OS_VER }}\`
          🛡️ *Patch Level:* \`${{ env.PATCH_LVL }}\`
          ━━━━━━━━━━━━━━━━━━━━
          📦 *Target Flavour:* \`${{ inputs.kernel_variant }}\`
          🔄 *Progress:* \`[■■■■■■■■□□] 85%\`
          ⏳ *Status:* Repacked as \`${{ env.OUT_BOOT_IMG }}\`! Starting MTProto upload...
          🔗 [Live Runner Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

      # ── Upload Patched Image to Telegram & Clean Status Message ───────────
      - name: Upload Patched boot.img & Deliver to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          STATUS_ID: ${{ inputs.status_message_id }}
        run: |
          printf '🎉 *Patched Boot Image Ready!*\n━━━━━━━━━━━━━━━━━━━━\n📦 *File:* `%s`\n📱 *Device Profile:* Poco F6 (`%s`) / GKI 2.0\n🐧 *Stock Kernel:* `Linux %s`\n🆕 *BruhKernel:* `Linux %s`\n🤖 *Android Version:* `Android %s`\n🛡️ *Patch Level:* `%s`\n🗜️ *Boot Format:* `Boot %s`\n📦 *Flavour:* `%s`\n🏷️ *Artifact:* `%s`\n━━━━━━━━━━━━━━━━━━━━\n📋 *Quick Flashing Steps:*\n• TWRP/OrangeFox: Install ➔ Install Image ➔ Select `%s` ➔ Flash to `Boot`\n• Fastboot: `fastboot flash boot %s`\n🔗 [Runner Log](https://github.com/%s/actions/runs/%s)\n' \
            "${{ env.OUT_BOOT_IMG }}" \
            "${{ inputs.device_target || 'peridot' }}" \
            "${{ env.KERNEL_VER }}" \
            "${{ env.NEW_UNAME_SHORT }}" \
            "${{ env.OS_VER }}" \
            "${{ env.PATCH_LVL }}" \
            "${{ env.FORMAT }}" \
            "${{ inputs.kernel_variant }}" \
            "${{ env.ARTIFACT_NAME }}" \
            "${{ env.OUT_BOOT_IMG }}" \
            "${{ env.OUT_BOOT_IMG }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}" > caption.txt

          echo "Uploading via MTProto with dynamic progress updates..."
          python3 bot/upload_tg.py "${CHAT_ID}" "patch_env/${{ env.OUT_BOOT_IMG }}" caption.txt "${STATUS_ID}" "${{ inputs.kernel_variant }}" "${{ inputs.device_target || 'peridot' }}" || {
            echo "MTProto upload failed, falling back to Bot API sendDocument..."
            curl -s \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@patch_env/${{ env.OUT_BOOT_IMG }};filename=${{ env.OUT_BOOT_IMG }}" \
              -F "caption=$(cat caption.txt)" \
              -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
            if [ -n "${STATUS_ID}" ]; then
              python3 bot/tg_progress.py delete "${CHAT_ID}" "${STATUS_ID}" || true
            fi
          }

      # ── Upload Patched Artifact to GitHub Actions (1-Day Retention) ───────
      - name: Archive Patched boot.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot_${{ env.KERNEL_VER }}_${{ env.VARIANT_LOWER }}_${{ github.run_id }}
          path: patch_env/${{ env.OUT_BOOT_IMG }}
          retention-days: 1


      # ── Failure Handler ──────────────────────────────────────────────────
      - name: Telegram Failure Notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          STATUS_ID: ${{ inputs.status_message_id }}
        run: |
          FAIL_MSG="❌ *Patching failed on GitHub Actions.*
          Log details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "${STATUS_ID}" ]; then
            python3 bot/tg_progress.py "${CHAT_ID}" "${STATUS_ID}" "${FAIL_MSG}"
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d parse_mode="Markdown" \
              --data-urlencode "text=${FAIL_MSG}"
          fi

      # ── Clean Cache & Environment (Always Runs) ──────────────────────────
      - name: Clean Cache & Environment
        if: always()
        run: |
          echo "🧹 Performing post-run cache and environment cleanup..."
          # 1. Clean Telegram / Telethon session files
          rm -f *.session *.session-journal *.session* 2>/dev/null || true
          # 2. Clean boot images, unpacked binaries, and temporary scripts
          rm -f stock_boot.img new_kernel caption.txt ./magiskboot 2>/dev/null || true
          # 3. Clean intermediate workspaces & archives
          rm -rf patch_env ak3 artifact_extracted kernel_artifact.zip kernel_release.zip 2>/dev/null || true
          # 4. Clean runner temp directory and pip cache
          rm -rf /tmp/bkc_* /tmp/telethon* 2>/dev/null || true
          pip3 cache purge 2>/dev/null || true
          echo "✅ Post-run cache cleanup complete. Current runner directory status:"
          ls -la
